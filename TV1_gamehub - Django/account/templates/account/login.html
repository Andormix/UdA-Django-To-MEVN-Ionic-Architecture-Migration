{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 register-card">
      <div class="card-header"><h4 class="mb-0">Log In</h4></div>
      <div class="card-body">
        <form method="post">
          {{ form.as_p }}
          {% csrf_token %}
          <button type="submit" class="btn btn-theme w-100">Log in</button>
        </form>
        <hr>
        <p class="text-center mb-0">
          Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
