{% extends "base.html" %}

{% block title %}Registration Complete{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="alert alert-success">
      <h4>Welcome, {{ new_user.first_name|default:new_user.username }}!</h4>
      <p>Your account has been created successfully. You can now log in.</p>
    </div>
    <a href="{% url 'login' %}" class="btn btn-primary">Log in now</a>
  </div>
</div>
{% endblock %}
