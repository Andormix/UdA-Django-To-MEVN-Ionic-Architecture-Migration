{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card register-card shadow-sm border-0">
      <div class="card-header"><h4 class="mb-0">Change Password</h4></div>
      <div class="card-body">
        <form method="post">
          {{ form.as_p }}
          {% csrf_token %}
          <button type="submit" class="btn btn-theme w-100">Change Password</button>
        </form>
        <hr>
        <p class="text-center mb-0">
          <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
