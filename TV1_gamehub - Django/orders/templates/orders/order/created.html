{% extends "base.html" %}

{% block title %}Order Confirmed{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 text-center">
    <div class="alert alert-success mt-4">
      <h2>🎉 Thank You!</h2>
      <p>Your order has been successfully placed.</p>
      <p>Order number: <strong>#{{ order.id }}</strong></p>
    </div>
    <p class="text-muted">A confirmation will be sent to <strong>{{ order.email }}</strong>.</p>
    <a href="{% url 'shop:product_list' %}" class="btn btn-primary">Continue Shopping</a>
    <a href="{% url 'devlog:post_list' %}" class="btn btn-outline-secondary ms-2">Back to Home</a>
  </div>
</div>
{% endblock %}
